subTitle:
  de: CI-Runner für GitHub, GitLab & Forgejo
  en: CI runners for GitHub, GitLab & Forgejo

# The API stores one description without a language and takes the German one.
# The English text is kept for the marketplace form.
description:
  de: >-
    Betreibe deine CI-Runner direkt in deinem mittwald Projekt. Runner anlegen, Registrierungsbefehl aus GitHub oder GitLab oder UUID und Token aus Forgejo einfügen, fertig: der Container startet auf Container Hosting und registriert sich selbst. Deine Jobs laufen auf deiner eigenen Infrastruktur.
  en: >-
    Run your CI runners inside your mittwald project. Create a runner, paste the setup command from GitHub or GitLab or UUID and token from Forgejo, done: the container starts on Container Hosting and registers itself. Your jobs run on your own infrastructure.

detailedDescriptions:
  de: |
    **CI Runner** bringt self-hosted Runner für GitHub Actions, GitLab CI und
    Forgejo Actions in dein mittwald Projekt. Jeder Runner ist ein Container auf
    Container Hosting: Runner desselben Repositorys, derselben Organisation,
    GitLab- oder Forgejo-Instanz
    teilen sich einen Container-Stack, jeder Runner registriert sich beim Start
    selbst.

    ## So funktioniert es

    1. CI-System wählen (GitHub Actions, GitLab CI oder Forgejo Actions)
    2. Registrierungsbefehl aus dem CI-System einfügen, bei Forgejo UUID und Token
    3. Größe wählen, anlegen

    Nach unter einer Minute nimmt der Runner Jobs an.

    ## Features

    - **GitHub Actions:** Repositorys und Organisationen, Registrierung mit dem
      Befehl von der "New self-hosted runner"-Seite
    - **GitLab CI:** Projekte, Gruppen oder ganze Instanzen, gitlab.com und
      self-hosted, mehrere Jobs gleichzeitig pro Runner
    - **Forgejo Actions:** Repositorys, Organisationen, Konten oder ganze
      Instanzen, mehrere Jobs gleichzeitig pro Runner. Der Runner bringt Node für
      JavaScript-Actions wie `actions/checkout` mit
    - **Größen:** Presets von Small bis Large plus frei wählbare CPU- und
      RAM-Limits
    - **Cache:** Persistenter Cache für Paketmanager (npm, pnpm, Yarn, pip,
      Composer, Go) mit automatischem Aufräum-Cronjob
    - **Ziel-Stack:** Runner in einen bestehenden Stack deines Projekts legen,
      damit Jobs dessen Services erreichen, zum Beispiel für Migrations
    - **Verwaltung:** Logs, Neustart, Einstellungen und Updates direkt in
      mStudio, inklusive Update-Hinweis und Changelog
    - **Sicherheit:** Die Extension speichert keine Tokens. Registrierungs-Tokens gehen
      nur in den Runner-Container, ein Personal Access Token brauchst du nicht

    ## Gut zu wissen

    Die Runner laufen ohne Docker-Daemon: Jobs laufen direkt auf Ubuntu 24.04,
    die Keywords `container:` und `services:` funktionieren nicht. Forgejo-Runner
    haben keinen Cache-Server, `actions/cache` geht dort nicht. Pakete lassen
    sich per `sudo apt-get` nachinstallieren. Jobs laufen mit sudo-Rechten im
    Container, nutze daher einen Runner pro Vertrauensbereich und lass keine
    fremden Pull Requests darauf laufen.

    Die Extension ist Open Source (MIT):
    [github.com/Hermsi1337/mstudio-ci-runner-extension](https://github.com/Hermsi1337/mstudio-ci-runner-extension)
  en: |
    **CI Runner** brings self-hosted runners for GitHub Actions, GitLab CI and
    Forgejo Actions into your mittwald project. Every runner is a container on
    Container Hosting: runners of the same repository, organization, GitLab or
    Forgejo instance
    share one container stack, and every runner registers itself on start.

    ## How it works

    1. Pick the CI system (GitHub Actions, GitLab CI or Forgejo Actions)
    2. Paste the setup command from the CI system, for Forgejo UUID and token
    3. Choose a size, create

    The runner picks up jobs in under a minute.

    ## Features

    - **GitHub Actions:** repositories and organizations, registration with the
      command from the "New self-hosted runner" page
    - **GitLab CI:** projects, groups or whole instances, gitlab.com and
      self-hosted, several concurrent jobs per runner
    - **Forgejo Actions:** repositories, organizations, users or whole
      instances, several concurrent jobs per runner. The runner ships Node for
      JavaScript actions such as `actions/checkout`
    - **Sizes:** presets from small to large plus custom CPU and RAM limits
    - **Cache:** persistent cache for package managers (npm, pnpm, Yarn, pip,
      Composer, Go) with an automatic cleanup cronjob
    - **Target stack:** put a runner into an existing stack of your project so
      jobs reach its services, for example for migrations
    - **Management:** logs, restart, settings and updates inside mStudio,
      including an update hint and a changelog
    - **Security:** the extension stores no tokens. Registration tokens only go into the
      runner container; no personal access token is needed

    ## Good to know

    The runners run without a Docker daemon: jobs run directly on Ubuntu 24.04,
    the `container:` and `services:` keywords do not work. Forgejo runners have
    no cache server, so `actions/cache` does not work there. Packages can be
    installed with `sudo apt-get`. Jobs run with sudo inside the container, so use
    one runner per trust boundary and keep untrusted pull requests off it.

    The extension is open source (MIT):
    [github.com/Hermsi1337/mstudio-ci-runner-extension](https://github.com/Hermsi1337/mstudio-ci-runner-extension)

