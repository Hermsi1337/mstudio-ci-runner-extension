# Marketplace entry and frontend fragment of the extension, applied by
# scripts/sync-extension.ts. The pipeline writes these values on every
# deployment, so mStudio is never the source of truth for them.
# Scopes and webhook URLs stay in the extension form: new scopes need every
# installation to consent again, and the webhook URL belongs to the host.
