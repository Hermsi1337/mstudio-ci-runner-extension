version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      mittwald:
        patterns: ["@mittwald/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      dev-dependencies:
        dependency-type: development
    ignore:
      # nitro 3 betas change the build output; pinned until the stable release
      - dependency-name: nitro
      # @weissaufschwarz/mitthooks-drizzle needs drizzle-orm 0.44
      - dependency-name: drizzle-orm
        update-types: ["version-update:semver-minor"]
      # the image runs the current Node LTS; majors are bumped by hand together with the Dockerfile
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @hey-api/openapi-ts needs the TypeScript 5 compiler API
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directories:
      - /docker/extension
      - /docker/runner/github
      - /docker/runner/gitlab
      - /docker/runner/forgejo
    schedule:
      interval: weekly
    ignore:
      # Node LTS and Ubuntu LTS are bumped by hand, see docs/operations.md
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # only LTS releases; interim releases like 24.10 leave support after nine months
      - dependency-name: ubuntu
    commit-message:
      prefix: "chore(deps)"
