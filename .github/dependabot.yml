version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      mittwald:
        patterns: ["@mittwald/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directories:
      - /docker/extension
      - /docker/runner/github
      - /docker/runner/gitlab
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
