name: Runner images

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: github
            image: ghcr.io/hermsi1337/mstudio-ci-runner-github
          - provider: gitlab
            image: ghcr.io/hermsi1337/mstudio-ci-runner-gitlab
    steps:
      - uses: actions/checkout@v7
      - name: Read the runner version from docker/runner/versions.json
        id: runner
        run: echo "version=$(jq -r '.${{ matrix.provider }}' docker/runner/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=runner-${{ steps.runner.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/runner
          file: docker/runner/${{ matrix.provider }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RUNNER_VERSION=${{ steps.runner.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.provider }}
          cache-to: type=gha,mode=max,scope=${{ matrix.provider }}
