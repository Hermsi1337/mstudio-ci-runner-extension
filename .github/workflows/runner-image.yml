name: Runner images

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: github
            image: ghcr.io/hermsi1337/mstudio-ci-runner-github
          - provider: gitlab
            image: ghcr.io/hermsi1337/mstudio-ci-runner-gitlab
          - provider: forgejo
            image: ghcr.io/hermsi1337/mstudio-ci-runner-forgejo
    steps:
      - uses: actions/checkout@v7
      - name: Read the runner version and the build args from docker/runner/versions.json
        id: runner
        run: |
          {
            echo "version=$(jq -r '.${{ matrix.provider }}.version' docker/runner/versions.json)"
            echo "build_args<<BUILD_ARGS"
            scripts/image-build-args.sh "${{ matrix.provider }}"
            echo "BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=runner-${{ steps.runner.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/runner
          file: docker/runner/${{ matrix.provider }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: ${{ steps.runner.outputs.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same scope as the test images (.github/actions/test-images), so a
          # release builds on the layers its verify job built.
          cache-from: type=gha,scope=${{ matrix.provider }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.provider }}-amd64

  builder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the kaniko version and the build args from docker/builder/versions.json
        id: kaniko
        run: |
          {
            echo "version=$(jq -r '.kaniko.version' docker/builder/versions.json)"
            echo "build_args<<BUILD_ARGS"
            scripts/image-build-args.sh builder
            echo "BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/hermsi1337/mstudio-ci-builder
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=kaniko-${{ steps.kaniko.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/builder
          file: docker/builder/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: ${{ steps.kaniko.outputs.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=builder-amd64
          cache-to: type=gha,mode=max,scope=builder-amd64

  docker-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/hermsi1337/mstudio-ci-docker-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/docker-api
          file: docker/docker-api/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-api
          cache-to: type=gha,mode=max,scope=docker-api
