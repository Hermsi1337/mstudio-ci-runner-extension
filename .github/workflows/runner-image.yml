name: Runner images

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: github
            image: ghcr.io/hermsi1337/mstudio-ci-runner-github
          - provider: gitlab
            image: ghcr.io/hermsi1337/mstudio-ci-runner-gitlab
          - provider: forgejo
            image: ghcr.io/hermsi1337/mstudio-ci-runner-forgejo
    steps:
      - uses: actions/checkout@v7
      - name: Read the runner, crane and Node versions and checksums from docker/runner/versions.json
        id: runner
        run: |
          {
            echo "version=$(jq -r '.${{ matrix.provider }}.version' docker/runner/versions.json)"
            echo "sha256_amd64=$(jq -r '.${{ matrix.provider }}.sha256.amd64' docker/runner/versions.json)"
            echo "sha256_arm64=$(jq -r '.${{ matrix.provider }}.sha256.arm64' docker/runner/versions.json)"
            echo "crane_version=$(jq -r '.crane.version' docker/runner/versions.json)"
            echo "crane_sha256_amd64=$(jq -r '.crane.sha256.amd64' docker/runner/versions.json)"
            echo "crane_sha256_arm64=$(jq -r '.crane.sha256.arm64' docker/runner/versions.json)"
            echo "node_version=$(jq -r '.node.version' docker/runner/versions.json)"
            echo "node_sha256_amd64=$(jq -r '.node.sha256.amd64' docker/runner/versions.json)"
            echo "node_sha256_arm64=$(jq -r '.node.sha256.arm64' docker/runner/versions.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=runner-${{ steps.runner.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/runner
          file: docker/runner/${{ matrix.provider }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RUNNER_VERSION=${{ steps.runner.outputs.version }}
            RUNNER_SHA256_AMD64=${{ steps.runner.outputs.sha256_amd64 }}
            RUNNER_SHA256_ARM64=${{ steps.runner.outputs.sha256_arm64 }}
            CRANE_VERSION=${{ steps.runner.outputs.crane_version }}
            CRANE_SHA256_AMD64=${{ steps.runner.outputs.crane_sha256_amd64 }}
            CRANE_SHA256_ARM64=${{ steps.runner.outputs.crane_sha256_arm64 }}
            NODE_VERSION=${{ steps.runner.outputs.node_version }}
            NODE_SHA256_AMD64=${{ steps.runner.outputs.node_sha256_amd64 }}
            NODE_SHA256_ARM64=${{ steps.runner.outputs.node_sha256_arm64 }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.provider }}
          cache-to: type=gha,mode=max,scope=${{ matrix.provider }}

  builder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the kaniko version from docker/builder/versions.json
        id: kaniko
        run: |
          {
            echo "go=$(jq -r '.kaniko.go' docker/builder/versions.json)"
            echo "version=$(jq -r '.kaniko.version' docker/builder/versions.json)"
            echo "repository=$(jq -r '.kaniko.repository' docker/builder/versions.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/hermsi1337/mstudio-ci-builder
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=kaniko-${{ steps.kaniko.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/builder
          file: docker/builder/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GO_VERSION=${{ steps.kaniko.outputs.go }}
            KANIKO_VERSION=${{ steps.kaniko.outputs.version }}
            KANIKO_REPOSITORY=${{ steps.kaniko.outputs.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder
