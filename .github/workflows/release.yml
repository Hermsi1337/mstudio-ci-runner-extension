name: Release

on:
  push:
    tags: ["v*"]

jobs:
  extension-image:
    uses: ./.github/workflows/extension-image.yml
    permissions:
      contents: read
      packages: write

  runner-images:
    uses: ./.github/workflows/runner-image.yml
    permissions:
      contents: read
      packages: write

  release:
    runs-on: ubuntu-latest
    needs: [extension-image, runner-images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build the image table for the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          github_runner="$(jq -r .github docker/runner/versions.json)"
          gitlab_runner="$(jq -r .gitlab docker/runner/versions.json)"
          {
            echo "## Images"
            echo
            echo "| Image | Pull |"
            echo "|---|---|"
            echo "| Extension | \`docker pull ghcr.io/hermsi1337/mstudio-ci-runner-extension:${version}\` |"
            echo "| GitHub runner (actions/runner ${github_runner}) | \`docker pull ghcr.io/hermsi1337/mstudio-ci-runner-github:${version}\` |"
            echo "| GitLab runner (gitlab-runner ${gitlab_runner}) | \`docker pull ghcr.io/hermsi1337/mstudio-ci-runner-gitlab:${version}\` |"
            echo
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true

  bump-version:
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Sync package.json with the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          current="$(jq -r .version package.json)"
          if [[ "$version" == "$current" ]]; then
            echo "package.json already at $version"
            exit 0
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump package.json to $version"
          git pull --rebase origin main
          git push origin main
