name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the image workflows of this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for workflow in extension-image.yml runner-image.yml; do
            while true; do
              run="$(gh run list --workflow "$workflow" --branch "$TAG" --limit 1 --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"')"
              case "$run" in
                completed/success) break ;;
                completed/*) echo "$workflow for $TAG ended with $run"; exit 1 ;;
                *) sleep 20 ;;
              esac
            done
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          github_runner="$(jq -r .github docker/runner/versions.json)"
          gitlab_runner="$(jq -r .gitlab docker/runner/versions.json)"
          {
            echo "## Images"
            echo
            echo "| Image | Pull |"
            echo "|---|---|"
            echo "| Extension | \`docker pull ghcr.io/hermsi1337/mstudio-ci-runner-extension:${version}\` |"
            echo "| GitHub runner (actions/runner ${github_runner}) | \`docker pull ghcr.io/hermsi1337/mstudio-ci-runner-github:${version}\` |"
            echo "| GitLab runner (gitlab-runner ${gitlab_runner}) | \`docker pull ghcr.io/hermsi1337/mstudio-ci-runner-gitlab:${version}\` |"
            echo
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --generate-notes
