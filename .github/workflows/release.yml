name: Release

# Tags are cut from any branch. A pre-release tag (v1.2.3-beta.1) builds the
# same images and creates a GitHub pre-release, but it never writes its version
# back to main and it never reaches production (deploy-production.yml refuses
# it).
on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated code is up to date
        run: pnpm run codegen && git diff --exit-code -- src/generated
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: Integration tests (testcontainers)
        run: pnpm run test:integration

  extension-image:
    uses: ./.github/workflows/extension-image.yml
    needs: [verify]
    permissions:
      contents: read
      packages: write

  runner-images:
    uses: ./.github/workflows/runner-image.yml
    needs: [verify]
    permissions:
      contents: read
      packages: write

  release:
    runs-on: ubuntu-latest
    needs: [extension-image, runner-images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build the image table for the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          github_runner="$(jq -r .github.version docker/runner/versions.json)"
          gitlab_runner="$(jq -r .gitlab.version docker/runner/versions.json)"
          kaniko="$(jq -r .kaniko.version docker/builder/versions.json)"
          {
            echo "## Images"
            echo
            echo "| Image | Pull |"
            echo "|---|---|"
            echo "| Extension | \`docker pull ghcr.io/hermsi1337/mstudio-ci-runner-extension:${version}\` |"
            echo "| GitHub runner (actions/runner ${github_runner}) | \`docker pull ghcr.io/hermsi1337/mstudio-ci-runner-github:${version}\` |"
            echo "| GitLab runner (gitlab-runner ${gitlab_runner}) | \`docker pull ghcr.io/hermsi1337/mstudio-ci-runner-gitlab:${version}\` |"
            echo "| Image builder (kaniko ${kaniko}) | \`docker pull ghcr.io/hermsi1337/mstudio-ci-builder:${version}\` |"
            echo "| Docker API for jobs | \`docker pull ghcr.io/hermsi1337/mstudio-ci-docker-api:${version}\` |"
            echo
          } > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  bump-version:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sync package.json with the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: bump package.json to ${{ steps.version.outputs.version }}"
          file_pattern: package.json
