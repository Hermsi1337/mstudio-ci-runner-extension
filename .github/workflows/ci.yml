name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated code is up to date
        run: pnpm run codegen && git diff --exit-code -- src/generated
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: No server-only code in the client bundle
        run: pnpm run check:bundle

  integration:
    # Testcontainers needs a Docker daemon, which the mittwald runner has not.
    # Container Hosting runs amd64. arm64 covers the platform checks of the
    # runner images and local development on arm64 machines.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: integration (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # stoplight/prism publishes amd64 images only.
      - if: runner.arch == 'ARM64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64
      # Ubuntu 24.04 strips the capabilities of an unconfined process in a user
      # namespace it creates. The builder runs its emulated builds in one, and
      # Container Hosting has no such restriction.
      - name: Allow user namespaces for unconfined processes
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Integration tests (testcontainers)
        run: pnpm run test:integration
