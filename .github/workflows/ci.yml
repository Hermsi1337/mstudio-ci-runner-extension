name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated code is up to date
        run: pnpm run codegen && git diff --exit-code -- src/generated
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: No server-only code in the client bundle
        run: pnpm run check:bundle

  integration:
    # Testcontainers needs a Docker daemon, which the mittwald runner has not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integration tests (testcontainers)
        run: pnpm run test:integration

  docker-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker/docker-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: docker/docker-api/go.mod
          cache-dependency-path: docker/docker-api/go.sum
      - name: Formatted
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # The CLI tests drive the docker CLI of the runner against a fake platform.
      - run: go test ./...
