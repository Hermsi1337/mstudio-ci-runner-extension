name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated code is up to date
        run: pnpm run codegen && git diff --exit-code -- src/generated
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: No server-only code in the client bundle
        run: pnpm run check:bundle

  integration:
    # Testcontainers needs a Docker daemon, which the mittwald runner has not.
    # Container Hosting runs amd64. arm64 covers the platform checks of the
    # runner images and local development on arm64 machines.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: integration (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # stoplight/prism publishes amd64 images only.
      - if: runner.arch == 'ARM64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64
      # Ubuntu 24.04 strips the capabilities of an unconfined process in a user
      # namespace it creates. The builder runs its emulated builds in one, and
      # Container Hosting has no such restriction.
      - name: Allow user namespaces for unconfined processes
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Integration tests (testcontainers)
        run: pnpm run test:integration
        env:
          IMAGE_EXPORT_DIR: ${{ runner.temp }}/images
      - name: Keep the image built under qemu for the hardware check
        uses: actions/upload-artifact@v7
        with:
          name: emulated-image-${{ runner.arch }}
          path: ${{ runner.temp }}/images/
          if-no-files-found: error
          retention-days: 1

  # The integration tests only read an emulated image back from the registry.
  # This job runs it on hardware of its own architecture, which catches a
  # binary that qemu ran but the real CPU does not.
  native-hardware:
    needs: integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            built-on: X64
            architecture: arm64
            machine: aarch64
          - runner: ubuntu-latest
            built-on: ARM64
            architecture: amd64
            machine: x86_64
    name: native hardware (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: emulated-image-${{ matrix.built-on }}
          path: images
      - name: Run the image on ${{ matrix.architecture }}
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          image="$(docker load -i "images/linux-${ARCHITECTURE}.tar" | sed -n 's/^Loaded image: //p')"
          test "$(docker image inspect -f '{{.Architecture}}' "${image}")" = "${ARCHITECTURE}"
          test "$(docker run --rm "${image}" uname -m)" = "${MACHINE}"
          test "$(docker run --rm "${image}" cat /machine)" = "${MACHINE}"
          docker run --rm "${image}" file --version
          docker run --rm "${image}" file /hello | grep -F "ELF 64-bit"
          test "$(docker run --rm "${image}" /hello)" = "hello from ${ARCHITECTURE}"
