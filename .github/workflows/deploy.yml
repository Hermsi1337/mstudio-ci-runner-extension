name: Deploy

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version to deploy, e.g. 0.1.0"
        required: true

concurrency:
  group: deploy-mstudio
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment: mstudio
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image version
        id: version
        env:
          REF: ${{ inputs.version || github.event.workflow_run.head_branch }}
        run: echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
      - uses: mittwald/deploy-container-action@v1
        env:
          EXTENSION_VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          EXTENSION_SECRET: ${{ secrets.EXTENSION_SECRET }}
          ENCRYPTION_MASTER_PASSWORD: ${{ secrets.ENCRYPTION_MASTER_PASSWORD }}
          ENCRYPTION_SALT: ${{ secrets.ENCRYPTION_SALT }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          api_token: ${{ secrets.MITTWALD_API_TOKEN }}
          stack_id: ${{ vars.MITTWALD_STACK_ID }}
          stack_file: deploy/mstudio/stack.yaml
          skip_recreation: postgres
