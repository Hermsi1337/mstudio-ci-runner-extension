name: Deploy

# Deploys one tag into one mStudio installation. Called by deploy-dev.yml
# (automatic after a release) and deploy-production.yml (manual). Everything
# that differs between the two lives in the GitHub environment: extension id
# and secret, stack id, API token, database password.

on:
  workflow_call:
    inputs:
      ref:
        description: "Tag to deploy, e.g. v0.1.0"
        required: true
        type: string
      environment:
        description: "GitHub environment holding the secrets of the installation"
        required: true
        type: string
      name_suffix:
        description: "Appended to the extension name in the marketplace entry"
        required: false
        default: ""
        type: string
      allow_prerelease:
        description: "Whether this installation accepts tags like v1.2.3-beta.1"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      # The check sits here and not in the calling workflow, so it holds
      # whatever triggers the deployment.
      - name: Refuse a pre-release in an installation that does not take one
        if: ${{ !inputs.allow_prerelease }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [[ "${REF}" == *-* ]]; then
            echo "${REF} is a pre-release and ${{ inputs.environment }} does not take pre-releases" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve image version
        id: version
        env:
          REF: ${{ inputs.ref }}
        run: echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
      - uses: mittwald/deploy-container-action@bc2fb8ccf6340a04da8a148f99c6eacc1a7b69fa # v1
        env:
          EXTENSION_VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          EXTENSION_SECRET: ${{ secrets.EXTENSION_SECRET }}
          ENCRYPTION_MASTER_PASSWORD: ${{ secrets.ENCRYPTION_MASTER_PASSWORD }}
          ENCRYPTION_SALT: ${{ secrets.ENCRYPTION_SALT }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        with:
          api_token: ${{ secrets.MITTWALD_API_TOKEN }}
          stack_id: ${{ secrets.MITTWALD_STACK_ID }}
          stack_file: deploy/mstudio/stack.yaml
          skip_recreation: postgres

  # Marketplace texts, logo and the fragment properties live in the repository,
  # so every deployment writes them into mStudio again.
  metadata:
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-metadata-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run extension:sync
        env:
          MITTWALD_API_TOKEN: ${{ secrets.MITTWALD_API_TOKEN }}
          MITTWALD_CONTRIBUTOR_ID: ${{ secrets.MITTWALD_CONTRIBUTOR_ID }}
          MITTWALD_EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          EXTENSION_NAME_SUFFIX: ${{ inputs.name_suffix }}
