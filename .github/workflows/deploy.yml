name: Deploy

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version to deploy, e.g. 0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-mstudio
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment: mstudio
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.event.workflow_run.head_branch }}
      - name: Resolve image version
        id: version
        env:
          REF: ${{ inputs.version || github.event.workflow_run.head_branch }}
        run: echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
      - uses: mittwald/deploy-container-action@bc2fb8ccf6340a04da8a148f99c6eacc1a7b69fa # v1
        env:
          EXTENSION_VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          EXTENSION_SECRET: ${{ secrets.EXTENSION_SECRET }}
          ENCRYPTION_MASTER_PASSWORD: ${{ secrets.ENCRYPTION_MASTER_PASSWORD }}
          ENCRYPTION_SALT: ${{ secrets.ENCRYPTION_SALT }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          api_token: ${{ secrets.MITTWALD_API_TOKEN }}
          stack_id: ${{ secrets.MITTWALD_STACK_ID }}
          stack_file: deploy/mstudio/stack.yaml
          skip_recreation: postgres

  # Marketplace texts, logo and the fragment properties live in the repository,
  # so every deployment writes them into mStudio again. Needs no Docker, so it
  # runs on the project's own runner.
  metadata:
    needs: deploy
    runs-on: [self-hosted, mittwald]
    environment: mstudio
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.event.workflow_run.head_branch }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run extension:sync
        env:
          MITTWALD_API_TOKEN: ${{ secrets.MITTWALD_API_TOKEN }}
          MITTWALD_CONTRIBUTOR_ID: ${{ secrets.MITTWALD_CONTRIBUTOR_ID }}
          MITTWALD_EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
